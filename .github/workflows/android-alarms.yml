name: Build Android alarms app

# Builds the phone app in GitHub's cloud (free) and puts the APK in public/downloads, so your
# Personal OS serves it (Settings > Phone alarms > Download) and the phone app can update itself.
# Runs by itself when files in android-alarms/ change, or press "Run workflow" in the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - "android-alarms/**"
      - ".github/workflows/android-alarms.yml"

permissions:
  contents: write

concurrency:
  group: android-alarms-build
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        working-directory: android-alarms
        run: gradle assembleDebug --no-daemon --stacktrace -PappVersionCode=${{ github.run_number }}

      - name: Keep a copy (Actions > this run > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: personal-os-alarms-apk
          path: android-alarms/app/build/outputs/apk/debug/app-debug.apk

      - name: Put the APK where Personal OS serves it
        run: |
          mkdir -p public/downloads
          cp android-alarms/app/build/outputs/apk/debug/app-debug.apk public/downloads/personal-os-alarms.apk
          SHA=$(sha256sum public/downloads/personal-os-alarms.apk | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"1.%s","apk":"personal-os-alarms.apk","sha256":"%s","builtAt":"%s"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > public/downloads/version.json
          cat public/downloads/version.json

      - name: Save it in the repository (Vercel then publishes it)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads
          git commit -m "Android alarms app build ${{ github.run_number }}" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
