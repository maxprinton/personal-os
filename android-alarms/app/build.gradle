plugins {
    id 'com.android.application'
}

// The build (GitHub) passes its run number, so every build is newer than the last one.
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()

android {
    namespace 'app.personalos.alarms'
    compileSdk 34

    defaultConfig {
        applicationId 'app.personalos.alarms'
        minSdk 28
        targetSdk 34
        versionCode appVersionCode
        versionName "1.${appVersionCode}"
    }

    // A fixed key (kept in the repo, it protects nothing) so a new build installs OVER the old one
    // and keeps your settings. Without it every build would have a different key.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
